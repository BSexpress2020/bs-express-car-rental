<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BS Express — หลังบ้านการจอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--red:#EA1824;--red-dark:#B9121C;--navy:#1B2E4E;--cream:#F6F7F9;--ink:#22262E;--soft:#667085;--line:#E3E6EA;--ok:#3F7D58;--warn:#B5502E}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Sarabun,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1{font:600 20px Kanit,sans-serif;margin:0}button,input,select{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px}.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--red);color:#fff}.btn.g{background:#fff;color:var(--red);border:1.5px solid var(--line)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}.chip.on{border-color:var(--red);background:#FFF1F1;color:var(--red-dark);font-weight:600}
.o{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}.hd{display:grid;gap:2px;padding:12px 14px;cursor:pointer}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.r1 b{font-family:Kanit,sans-serif}.sub{color:var(--soft);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.dt{padding:0 14px 14px;border-top:1px dashed var(--line)}.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:12px 0;font-size:14px}.kv span{color:var(--soft)}.kv b{font-weight:600;white-space:pre-wrap;word-break:break-word}
.im{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.im a{display:block;text-align:center;font-size:12px;color:var(--soft);text-decoration:none}.im img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ctl .btn{grid-column:span 1}
.empty,.msg{text-align:center;color:var(--soft);padding:24px 0}#err{color:var(--warn);min-height:22px}
.dv{position:fixed;inset:0;z-index:99;background:rgba(16,24,40,.94);display:none;flex-direction:column}.dv.on{display:flex}
.dv .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.dv .bar b{font-family:Kanit,sans-serif;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dv .bar span{display:flex;gap:8px;flex:none}.dv .bar .btn{padding:8px 12px;text-decoration:none;font-size:14px}
.dv .bd{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;text-align:center}
.dv .bd img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.dv .bd iframe{border:0;width:100%;height:100%;min-height:70vh;background:#fff}
.dv .ms{color:#fff;padding:40px 12px}
@media print{body>*:not(#dv){display:none!important}.dv{position:static;display:block;background:#fff}.dv .bar,.dv .ms{display:none}.dv .bd{padding:0;overflow:visible}.dv .bd img{width:100%;box-shadow:none}}
.sc{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}.sc label{display:flex;gap:6px;align-items:center}.sc input{width:auto;padding:0}.bi{grid-column:1/-1;font-size:13.5px;color:var(--soft)}
.rs{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.rs .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.rs .st{font-size:13.5px;padding:8px 10px;border-radius:10px;margin-top:8px}
.rs .rn{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:13.5px;color:var(--soft)}.rs .rn input{width:auto;padding:0;margin-top:3px}.rs .lg{color:var(--soft);font-size:13px;white-space:pre-wrap;margin-top:10px}
</style></head><body>
<div class="wrap" id="login"><div class="box" style="max-width:380px;margin:12vh auto 0"><h1>หลังบ้านการจอง</h1><p style="color:var(--soft)">BS Express — สำหรับเจ้าหน้าที่</p>
<input id="pw" type="password" placeholder="รหัสผ่านแอดมิน" autocomplete="current-password"><div id="err"></div><button class="btn" style="width:100%" onclick="login()">เข้าสู่ระบบ</button></div></div>
<div class="wrap" id="app" hidden>
<div class="top"><h1 style="flex:none">ออเดอร์</h1><input id="q" type="search" placeholder="ค้นหา เลขที่จอง / ชื่อ / เบอร์"><button class="btn g" id="rf" onclick="loadOrders()">รีเฟรช</button><button class="btn g" onclick="cod()">สมัคร COD</button><button class="btn g" onclick="fbv()">ข้อเสนอแนะ</button><button class="btn g" onclick="csv()">ส่งออก CSV</button><button class="btn g" onclick="logout()">ออก</button></div>
<div id="ts" style="color:var(--soft);font-size:13px;margin:-4px 0 8px"></div><div class="box" id="warn" hidden style="margin-bottom:12px;color:var(--warn);background:#FFF4EE"></div><div class="chips" id="chips"></div><div id="list"></div><div id="cod" hidden></div><div id="fb" hidden></div></div>
<div class="dv" id="dv" role="dialog" aria-modal="true"><div class="bar"><b id="dvT"></b><span><a class="btn g" id="dvO" target="_blank" rel="noopener" hidden>เปิดแท็บใหม่</a><button class="btn g" id="dvP" hidden onclick="window.print()">พิมพ์</button><button class="btn" onclick="dvClose()">ปิด</button></span></div><div class="bd" id="dvB"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzt9urhRHBeurGDVC3Qto60l6EfXua8gmZnROhE9hbyN87n-ZETE7xAZXlmnKcvfAz1/exec';
const DRV=[['อดิศักดิ์ เจียวสว่าง','ทีม','ขอนแก่น ผล-2234'],['ประสิทธิ์ วิเศษทรัพย์','แบงค์','นครราชสีมา ผว-9667'],['เฉลิมชัย วงษ์หมื่นเนตร','แดง','กทม 3ฒฐ-5403'],['พรศักดิ์ ค่าคง','ติ้ว','กรุงเทพฯ 2ฒผ-9659'],['สะอาด ศักดี','อาด','กรุงเทพฯ 2ฒฒ 920'],['เก่ง เข็มทอง','เก่ง','กรุงเทพฯ 2ฒภ 772'],['ประจักษ์ อุราสาย','จักร','อุบลฯ ผผ 7314'],['วุฒิชัย สายสมบัติ','วุฒิ','อุบลฯ ผบ-3445'],['กิตติพงษ์ ทองมาก','แซม','กรุงเทพ 3ฒจ-499'],['กมล สุขเกษม','โจ','ปราจีนบุรี บบ-7948'],['วิลาศ บุญทศ','วิลาศ','กรุงเทพฯ 1ฒย-5322'],['ปณิธาน บุญเลิศ','เวฟ','กรุงเทพฯ 2ฒพ 6908'],['ณัฐพล วงศ์กระโซ่','เป้','นครสวรรค์ ผต 3357'],['วัฒนวิจิตร ปวนสุข','ปาย','กรุงเทพฯ 3ฒบ 7184'],['ปรีชา ทัดวงษ์','เสือ','กรุงเทพฯ 4ฒก-6118'],['ฐาปนา แท่นคำ','หน่อง','1ฒย 3148 กทม.']],drvLabel=d=>d[0]+' ('+d[1]+')'; // รายชื่อคนรถ: [ชื่อจริง, ชื่อเล่น, ทะเบียน] — เพิ่ม/แก้คนรถที่นี่
// ===== ส่งออกตามแม่แบบ Quickwin (BSOrderTemplate.xlsx) : หัวคอลัมน์ A→AG เรียงตามคู่มือ =====
const QW_HEAD=['OrderNo','OrderType','BranchCode','OrderDate','ItemDesc','PackagingUnit','Weight','Price','QTY','TotalAmt','CODAmt','OrderRemark','TrackingNo','SndFirstName','SndAddrNo','SndAddTumbon','SndAddrAmphoe','SndAddrProvince','SndPostCode','SndCountry','SndTel','SndTaxID','DestFirstName','DestAddrNo','DestAddTumbon','DestAddrAmphoe','DestAddrProvince','DestPostCode','DestCountry','DestTel','DestTaxID','ExtRefID','SalesPersonID'];
// ช่องที่คู่มือบอกว่า "ต้องใส่" (O ที่อยู่ผู้ส่งใส่หรือไม่ก็ได้) — ถ้าว่างจะเตือนหลังส่งออก
const QW_REQ=['OrderType','BranchCode','OrderDate','ItemDesc','PackagingUnit','Price','QTY','SndFirstName','SndAddTumbon','SndAddrAmphoe','SndAddrProvince','SndPostCode','SndCountry','SndTel','DestFirstName','DestAddrNo','DestAddTumbon','DestAddrAmphoe','DestAddrProvince','DestPostCode','DestCountry','DestTel','ExtRefID'];
const QW_ITEM='พัสดุ',QW_UNIT='ชิ้น'; // E ItemDesc / F PackagingUnit (ฟอร์มจองไม่ได้เก็บชนิดสินค้า)
const BKK='กรุงเทพมหานคร',PROV_FIX={'กรุงเทพ':BKK,'กรุงเทพฯ':BKK,'กทม':BKK,'กทม.':BKK};
// "ชื่อ • เบอร์" -> [ชื่อ, เบอร์]
function pNP(s){s=String(s||'');const i=s.lastIndexOf('•');return i<0?[s.trim(),'']:[s.slice(0,i).trim(),s.slice(i+1).trim()]}
// แยกที่อยู่ที่ฟอร์มรวมไว้ ("เลขที่ ต.x อ.y จ.z 12345" หรือ "เลขที่ แขวงx y กรุงเทพมหานคร 12345")
function pAddr(s){
  s=' '+String(s||'').trim();if(!s.trim())return{no:'',sub:'',dist:'',prov:'',zip:''};
  let m=s.match(/^([\s\S]*)\sแขวง(\S+)\s(\S+)\sกรุงเทพมหานคร(?:\s(\d{5}))?$/);
  if(m)return{no:m[1].trim(),sub:m[2],dist:m[3],prov:BKK,zip:m[4]||''};
  m=s.match(/^([\s\S]*)\sต\.(.+?)\sอ\.(.+?)\sจ\.(.+?)(?:\s(\d{5}))?$/);
  if(m){const p=m[4].trim();return{no:m[1].trim(),sub:m[2],dist:m[3],prov:PROV_FIX[p]||p,zip:m[5]||''}}
  return{no:s.trim(),sub:'',dist:'',prov:'',zip:''}; // แยกไม่ได้ -> ใส่ทั้งหมดไว้ที่ AddrNo ให้เจ้าหน้าที่แก้เอง
}
// ใช้ฟิลด์ที่อยู่แยกช่องจากฟอร์ม (pickupNo/Sub/Dist/Prov/Zip, rcv…) ถ้าไม่มี (ออเดอร์เก่า) ค่อยแกะจากข้อความรวม
function qwAddr(o,pre,fb){const z=k=>String(o[pre+k]==null?'':o[pre+k]).trim(),p=z('Prov');return p?{no:z('No'),sub:z('Sub'),dist:z('Dist'),prov:PROV_FIX[p]||p,zip:z('Zip')}:pAddr(fb)}
function qwRow(o,br,date){
  const [n1,t1]=pNP(o.sender),[n2,t2]=pNP(o.receiver),sn=o.sndName||n1,sp=o.sndTel||t1,rn=o.rcvName||n2,rp=o.rcvTel||t2,
    a=qwAddr(o,'pickup',o.pickupAddress),b=qwAddr(o,'rcv',o.receiverAddress),ph=v=>String(v||'').replace(/[\s-]/g,'');
  return{OrderType:/ปลายทาง/.test(o.payment||'')?'SO2':'SO1',BranchCode:br,OrderDate:date,ItemDesc:QW_ITEM,PackagingUnit:QW_UNIT,Price:o.total||'',QTY:1,
    SndFirstName:sn,SndAddrNo:a.no,SndAddTumbon:a.sub,SndAddrAmphoe:a.dist,SndAddrProvince:a.prov,SndPostCode:a.zip,SndCountry:'THAILAND',SndTel:ph(sp||o.pickupPhone),
    DestFirstName:rn,DestAddrNo:b.no,DestAddTumbon:b.sub,DestAddrAmphoe:b.dist,DestAddrProvince:b.prov,DestPostCode:b.zip,DestCountry:'THAILAND',DestTel:ph(rp),ExtRefID:o.ref,CODAmt:o.codAmt||''};
}
const COL={'รอร้านยืนยัน':['#9A6B00','#FFF4D6'],'ยืนยันแล้ว · รอเลขบิล':['#1D5FBF','#E6F0FD'],'รอรถเข้ารับ':['#6B4FBB','#EFEAFB'],'รับพัสดุแล้ว':['#1F7A4D','#E6F4EC'],'ยกเลิก':['#667085','#EEF0F3']};
const SLIP={'':['สลิปรอตรวจ','#9A6B00','#FFF4D6'],'ผ่าน':['สลิปถูกต้อง','#1F7A4D','#E6F4EC'],'ไม่ผ่าน':['สลิปไม่ถูกต้อง','#B5502E','#FDECE7']};
const BI={},OCR_AUTO=true; // OCR_AUTO=true = เลือกรูปบิลแล้วอ่านเลขแทรคขึ้นช่องเลขบิลให้เอง (เจ้าหน้าที่ตรวจเลขแล้วกดบันทึกเอง) / false = ปิด ให้กรอกเอง
const fmtD=v=>{if(!/^\d{4}-\d\d-\d\dT/.test(String(v||'')))return v;const t=new Date(new Date(v).getTime()+7*36e5),p=n=>String(n).padStart(2,'0');return p(t.getUTCDate())+'/'+p(t.getUTCMonth()+1)+'/'+t.getUTCFullYear()}; // ชีตแปลงวันที่รับเป็นวันที่ -> แสดงเป็น วว/ดด/ปปปป
const PAID='ชำระแล้ว',RCV=o=>/ปลายทาง/.test(o.payment||''),UNP=o=>o.bill&&o.paid!==PAID&&o.status!=='ยกเลิก'&&!RCV(o),SLP=o=>o.slip&&!o.slipCheck&&o.status!=='ยกเลิก',
  RSP=o=>(o.rsState==='รอลูกค้าตอบ'||o.rsState==='ลูกค้าขอวันอื่น')&&o.status!=='ยกเลิก'&&o.status!=='รับพัสดุแล้ว'; // ยังไม่ชำระ = ออกบิลแล้วแต่ยังไม่ติ๊กชำระ (รวมที่รับพัสดุแล้ว) / ไม่นับออเดอร์ "ผู้รับจ่ายปลายทาง" เพราะผู้ส่งไม่ต้องจ่าย
function shrink(f,mx=1400){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=u})}
// ===== อ่านเลขพัสดุจากรูปบิล (Tesseract.js โหลดเมื่อเลือกรูปครั้งแรก) =====
let OCRW;
function loadScript(src){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('โหลดตัวอ่านเลขไม่ได้'));document.head.appendChild(s)})}
async function ocrCanvas(f){ // ขยายรูปก่อนอ่าน: รูปเล็กอ่าน 0 เป็น O ผิดบ่อย (ทดสอบแล้ว ขยาย 3 เท่าอ่านถูก)
  const u=URL.createObjectURL(f),i=await new Promise((ok,no)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=no;m.src=u}),
    k=Math.min(3,2400/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);return c}
// เลขพัสดุ = BS + รหัสสาขา(ตัวอักษร) + ตัวเลขล้วน เช่น BSDPON062769100002 / ส่วนตัวเลขถ้าอ่านเป็นตัวอักษร (O,I,S...) แก้เป็นเลขให้
function pickTrack(text){
  const M={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',G:'6',B:'8'},c=[];
  String(text).toUpperCase().split('\n').forEach(l=>(l.replace(/\s/g,'').match(/BS[A-Z0-9]{12,22}/g)||[]).forEach(t=>{
    const b=t.slice(2),i=b.search(/\d/);if(i<0)return;const d=b.slice(i).replace(/[A-Z]/g,ch=>M[ch]||ch);
    if(/^\d{8,}$/.test(d))c.push('BS'+b.slice(0,i)+d)}));
  return c[0]||''}
async function readTrack(f){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  OCRW=OCRW||Tesseract.createWorker('eng',1,{langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'});
  const w=await OCRW,r=await w.recognize(await ocrCanvas(f));return pickTrack(r.data.text)}
let T=sessionStorage.getItem('bsa')||'',D=[],ST=[],F='all',OPEN={};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=d=>{const t=new Date(d);return isNaN(t)?'':t.toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
async function api(o){const r=await fetch(API,{method:'POST',cache:'no-store',body:JSON.stringify(Object.assign({token:T},o))}),x=await r.text();try{return JSON.parse(x)}catch(e){throw new Error('หลังบ้านตอบกลับผิดรูปแบบ ลองใหม่อีกครั้ง')}}
async function login(){T=$('pw').value.trim();$('err').textContent='';await loadOrders(1)}
function logout(){T='';sessionStorage.removeItem('bsa');location.reload()}
async function loadOrders(first){
  const rb=$('rf');rb.disabled=true;rb.textContent='กำลังโหลด...';
  try{
    const j=await api({action:'list'});if(!j.ok)throw new Error(j.error);
    const had=new Set(D.map(o=>o.ref)),nw=D.length?j.orders.filter(o=>!had.has(o.ref)).length:0;D=j.orders;ST=j.statuses;sessionStorage.setItem('bsa',T);$('login').hidden=true;$('app').hidden=false;
    const old=!ST.includes('รอรถเข้ารับ')||!(j.ver>=4);$('warn').hidden=!old;
    if(old)$('warn').textContent='หลังบ้าน (Apps Script) ยังเป็นโค้ดเก่า — ต้อง Deploy → New version ก่อน ไม่งั้นการตรวจสลิป/ชำระเงิน รูปบิล เลื่อนวันรับ และชื่อคนรถจะไม่ถูกบันทึก';
    render();$('ts').textContent='อัปเดตล่าสุด '+new Date().toLocaleTimeString('th-TH')+' · '+D.length+' ออเดอร์'+(nw?' · ใหม่ '+nw+' รายการ':'');
  }catch(e){
    const bad=e.message==='unauthorized';
    if(bad||first){T='';sessionStorage.removeItem('bsa');$('login').hidden=false;$('app').hidden=true;$('err').textContent=bad?'รหัสผ่านไม่ถูกต้อง':'เชื่อมต่อไม่ได้ ('+e.message+')'}
    else{$('login').hidden=true;$('app').hidden=false;$('warn').hidden=false;$('warn').textContent='โหลดข้อมูลไม่สำเร็จ ('+e.message+') — กด “รีเฟรช” เพื่อลองใหม่'}   // ไม่เด้งออกจากระบบเงียบ ๆ อีก
  }
  rb.disabled=false;rb.textContent='รีเฟรช';

// ===== ดูเอกสารในหน้า: แปลง data URL -> Blob URL (Chrome บล็อก data: PDF ใน iframe / แท็บใหม่บน iPad-มือถือค้าง) =====
function d2b(u){const i=String(u||'').indexOf(',');if(i<0||u.slice(0,5)!=='data:')return null;
  const h=u.slice(5,i),raw=u.slice(i+1),bin=/;base64/i.test(h)?atob(raw):decodeURIComponent(raw),a=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);
  let m=h.split(';')[0]||'';
  if(a[0]===0x25&&a[1]===0x50&&a[2]===0x44&&a[3]===0x46)m='application/pdf';else if(a[0]===0xFF&&a[1]===0xD8)m='image/jpeg';else if(a[0]===0x89&&a[1]===0x50)m='image/png';
  return new Blob([a],{type:m||'application/octet-stream'})}
